AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Hermes v2 (Lambda + HTTP API + EventBridge Scheduler)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256

Parameters:
  SsmPrefix:
    Type: String
    Default: /hermes/prod/telegram
    Description: Prefixo dos parâmetros SecureString (bot-token, webhook-secret, allowed-chat-ids)

  VaultRepo:
    Type: String
    Default: paulobarbosa-dev/obsidian-vault
    Description: Repositório privado do Vault (owner/repo). Não é segredo.
  VaultBranch:
    Type: String
    Default: main
  VaultTokenParam:
    Type: String
    Default: /hermes/prod/vault/github-token
    Description: Nome (não o valor) do parâmetro SecureString com o PAT fine-grained do Vault

  RenatoSsmPrefix:
    Type: String
    Default: /renato/prod/telegram
    Description: Prefixo dos parâmetros SecureString do bot independente do Renato

  NotionTokenParam:
    Type: String
    Default: /hermes/prod/notion/token
    Description: Nome (não o valor) do parâmetro SecureString com o token da integração do Notion
  NotionTasksDb:
    Type: String
    Default: ""
    Description: ID (32 caracteres) do banco Tarefas do Notion. Vazio = tarefas e metas continuam no Vault.
  NotionMetasDb:
    Type: String
    Default: ""
    Description: ID (32 caracteres) do banco Metas do Notion. Preencha junto com NotionTasksDb.
  NotionTemasDb:
    Type: String
    Default: ""
    Description: ID (32 caracteres) do banco Temas do Notion (Renato). Vazio = o Renato continua gravando no Vault.
  NotionNotasDb:
    Type: String
    Default: ""
    Description: ID (32 caracteres) do banco Notas do Notion (Renato). Preencha junto com NotionTemasDb.
  RenatoAiMaxInputChars:
    Type: String
    Default: "6000"
    Description: Tamanho máximo da mensagem para o Renato organizar em nota (maior que o do Hermes)
  RenatoAiMaxOutputTokens:
    Type: String
    Default: "2000"
    Description: Tokens de saída do Renato (a nota estruturada é longa). O API Gateway corta em 30 s, então não suba muito
  RenatoAiTimeoutMs:
    Type: String
    Default: "20000"
    Description: Tempo máximo da chamada ao modelo no Renato (deixa folga dentro dos 30 s do API Gateway)

  AiEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Liga a conversa natural (Hermes e Renato) via Amazon Bedrock. Desligada por padrão.
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Inference profile do Claude Haiku 4.5 (o modelo não existe em sa-east-1; o profile "us." roteia entre regiões dos EUA)
  BedrockApiKeyParam:
    Type: String
    Default: /hermes/prod/bedrock/api-key
    Description: Nome (não o valor) do parâmetro SecureString com a API key do Bedrock, compartilhada pelo Hermes e pelo Renato
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Região do Bedrock Runtime, que pode diferir da região da stack
  NeonDatabaseUrlParam:
    Type: String
    Default: /hermes/prod/neon/database-url
    Description: Nome (não o valor) do parâmetro SecureString com a connection string do Neon (histórico curto da conversa do Hermes). Sem o parâmetro, o Hermes conversa sem histórico.
  AiMaxHistoryMessages:
    Type: String
    Default: "6"
  AiMaxInputChars:
    Type: String
    Default: "1000"
  AiMaxOutputTokens:
    Type: String
    Default: "400"

Resources:
  HermesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  HermesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Sourcemap: false
        # Bundle ESM com dependências CommonJS (SDK da AWS, yaml): sem isto a Lambda falha no
        # init com 'Dynamic require of "process" is not supported'.
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);
        EntryPoints: [src/handler.ts]
        OutExtension: [.js=.mjs]
    Properties:
      Handler: handler.handler
      CodeUri: .
      LoggingConfig:
        LogGroup: !Ref HermesLogGroup
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN_PARAM: !Sub "${SsmPrefix}/bot-token"
          TELEGRAM_WEBHOOK_SECRET_PARAM: !Sub "${SsmPrefix}/webhook-secret"
          TELEGRAM_ALLOWED_CHAT_IDS_PARAM: !Sub "${SsmPrefix}/allowed-chat-ids"
          VAULT_REPO: !Ref VaultRepo
          VAULT_BRANCH: !Ref VaultBranch
          VAULT_GITHUB_TOKEN_PARAM: !Ref VaultTokenParam
          AI_ENABLED: !Ref AiEnabled
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_API_KEY_PARAM: !Ref BedrockApiKeyParam
          BEDROCK_REGION: !Ref BedrockRegion
          NEON_DATABASE_URL_PARAM: !Ref NeonDatabaseUrlParam
          NOTION_TOKEN_PARAM: !Ref NotionTokenParam
          NOTION_TASKS_DB: !Ref NotionTasksDb
          NOTION_METAS_DB: !Ref NotionMetasDb
          AI_MAX_HISTORY_MESSAGES: !Ref AiMaxHistoryMessages
          AI_MAX_INPUT_CHARS: !Ref AiMaxInputChars
          AI_MAX_OUTPUT_TOKENS: !Ref AiMaxOutputTokens
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/bot-token"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/webhook-secret"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/allowed-chat-ids"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VaultTokenParam}"
                # API key do Bedrock: a chamada usa a key (bearer), não a role, então a role só lê o parâmetro.
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BedrockApiKeyParam}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NeonDatabaseUrlParam}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NotionTokenParam}"
      Events:
        TelegramWebhook:
          Type: HttpApi
          Properties:
            Path: /telegram/webhook
            Method: POST
        # Um schedule por entrada de src/config.ts (test/template.test.ts confere que os dois batem).
        # Domingo é descanso: nenhum schedule. Falha repete no máximo 2 vezes em 1 h.
        ScheduleMon:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 14 ? * MON *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"kind":"checkin"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
        ScheduleTue:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 14 ? * TUE *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"kind":"checkin"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
        ScheduleWed:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 14 ? * WED *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"kind":"checkin"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
        ScheduleThu:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 14 ? * THU *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"kind":"metrics"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
        ScheduleFri:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 14 ? * FRI *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"kind":"checkin"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
        ScheduleSat:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 18 ? * SAT *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"kind":"weekly_review"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600

  RenatoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  RenatoFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Sourcemap: false
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);
        EntryPoints: [renato/src/lambda.ts]
        OutExtension: [.js=.mjs]
    Properties:
      Handler: lambda.handler
      CodeUri: .
      LoggingConfig:
        LogGroup: !Ref RenatoLogGroup
      Environment:
        Variables:
          RENATO_TELEGRAM_BOT_TOKEN_PARAM: !Sub "${RenatoSsmPrefix}/bot-token"
          RENATO_TELEGRAM_WEBHOOK_SECRET_PARAM: !Sub "${RenatoSsmPrefix}/webhook-secret"
          RENATO_TELEGRAM_ALLOWED_CHAT_IDS_PARAM: !Sub "${RenatoSsmPrefix}/allowed-chat-ids"
          RENATO_VAULT_REPO: !Ref VaultRepo
          RENATO_VAULT_BRANCH: !Ref VaultBranch
          RENATO_VAULT_DIRECTORY: Renato/Notas
          RENATO_VAULT_GITHUB_TOKEN_PARAM: !Ref VaultTokenParam
          AI_ENABLED: !Ref AiEnabled
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_API_KEY_PARAM: !Ref BedrockApiKeyParam
          BEDROCK_REGION: !Ref BedrockRegion
          AI_MAX_HISTORY_MESSAGES: !Ref AiMaxHistoryMessages
          AI_MAX_INPUT_CHARS: !Ref RenatoAiMaxInputChars
          AI_MAX_OUTPUT_TOKENS: !Ref RenatoAiMaxOutputTokens
          AI_TIMEOUT_MS: !Ref RenatoAiTimeoutMs
          NOTION_TOKEN_PARAM: !Ref NotionTokenParam
          NEON_DATABASE_URL_PARAM: !Ref NeonDatabaseUrlParam
          NOTION_TEMAS_DB: !Ref NotionTemasDb
          NOTION_NOTAS_DB: !Ref NotionNotasDb
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NotionTokenParam}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NeonDatabaseUrlParam}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RenatoSsmPrefix}/bot-token"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RenatoSsmPrefix}/webhook-secret"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RenatoSsmPrefix}/allowed-chat-ids"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VaultTokenParam}"
                # API key do Bedrock: a chamada usa a key (bearer), não a role, então a role só lê o parâmetro.
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BedrockApiKeyParam}"
      Events:
        RenatoTelegramWebhook:
          Type: HttpApi
          Properties:
            Path: /renato/webhook
            Method: POST

Outputs:
  WebhookUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/telegram/webhook"
  RenatoWebhookUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/renato/webhook"
