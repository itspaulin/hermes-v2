AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Hermes v2 - fundação (Lambda + HTTP API)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256

Parameters:
  SsmPrefix:
    Type: String
    Default: /hermes/prod/telegram
    Description: Prefixo dos parâmetros SecureString (bot-token, webhook-secret, allowed-chat-ids)

  VaultRepo:
    Type: String
    Default: itspaulin/obsidian-vault
    Description: Repositório privado do Vault (owner/repo). Não é segredo.
  VaultBranch:
    Type: String
    Default: main
  VaultTokenParam:
    Type: String
    Default: /hermes/prod/vault/github-token
    Description: Nome (não o valor) do parâmetro SecureString com o PAT fine-grained do Vault

Resources:
  HermesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  HermesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Sourcemap: false
        # Bundle ESM com dependências CommonJS (SDK da AWS, yaml): sem isto a Lambda falha no
        # init com 'Dynamic require of "process" is not supported'.
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);
        EntryPoints: [src/handler.ts]
        OutExtension: [.js=.mjs]
    Properties:
      Handler: handler.handler
      CodeUri: .
      LoggingConfig:
        LogGroup: !Ref HermesLogGroup
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN_PARAM: !Sub "${SsmPrefix}/bot-token"
          TELEGRAM_WEBHOOK_SECRET_PARAM: !Sub "${SsmPrefix}/webhook-secret"
          TELEGRAM_ALLOWED_CHAT_IDS_PARAM: !Sub "${SsmPrefix}/allowed-chat-ids"
          VAULT_REPO: !Ref VaultRepo
          VAULT_BRANCH: !Ref VaultBranch
          VAULT_GITHUB_TOKEN_PARAM: !Ref VaultTokenParam
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/bot-token"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/webhook-secret"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/allowed-chat-ids"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VaultTokenParam}"
      Events:
        TelegramWebhook:
          Type: HttpApi
          Properties:
            Path: /telegram/webhook
            Method: POST

Outputs:
  WebhookUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/telegram/webhook"
